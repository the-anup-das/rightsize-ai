# Hardware presets. Every record carries provenance. memory_gib is the card's memory in GiB
# (1024**3 bytes) exactly as the vendor and nvidia-smi state it, so a "16GB" card is 16 here;
# rightsize converts it to decimal GB (17.18) before comparing it with model sizes. Bandwidth is
# the vendor-stated peak memory bandwidth in GB/s (decimal). usable_fraction is the share of
# memory the runtime can use in practice (Apple defaults to ~70% of unified memory for the GPU;
# discrete GPUs lose ~0.5-1 GB to the driver and display). Values marked hand: true were typed
# from the cited page, not ingested.
presets:
