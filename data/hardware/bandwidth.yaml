# Memory bandwidth, the number the speed model runs on (tok/s ~ bandwidth / bytes per token).
#
# No public table carries this under a licence we can redistribute: Hugging Face's SKU table
# has TFLOPS but no bandwidth, Wikidata has no such property, and the databases that do have
# it are scraped from TechPowerUp. So rather than copy a derived figure, we record the two
# primary facts the vendor publishes and do the arithmetic ourselves:
#
#     bandwidth_gbps = bus_width_bits * memory_speed_gbps / 8      (mem.bandwidth.bus_x_rate.v0)
#
# For GDDR parts that is exact. HBM parts and Apple silicon do not divide cleanly, because the
# clock is not a round number, and their vendors state bandwidth outright - those records carry
# `bandwidth_gbps` directly and say so with `stated: true`.
#
# `name` matches data/hardware/gpus.yaml, so the two files join. `aliases` catch the names
# people actually type. Every record is hand-entered from the cited page: hand: true.
formula_id: mem.bandwidth.bus_x_rate.v0
devices:
