# Real bits-per-weight for GGUF tensor types, including scales and mins.
# Computed from the block formulas in llama.cpp gguf-py/gguf/constants.py as mirrored by
# huggingface.js packages/gguf/src/quant-descriptions.ts: bpw = type_size_bytes * 8 / block_size.
# File types (Q4_K_M etc.) are mixes of tensor types; their effective bpw is in file_types below.
provenance:
  source_url: https://github.com/huggingface/huggingface.js/blob/main/packages/gguf/src/quant-descriptions.ts
  fetched_at: "2026-09-25"
  note: tensor_types derived from GGML_QUANT_SIZES; file_types measured, see their own provenance

tensor_types:
  F32: 32.0
  F16: 16.0
  BF16: 16.0
  Q8_0: 8.5
  Q8_1: 9.0
  Q8_K: 9.125
  Q6_K: 6.5625
  Q5_0: 5.5
  Q5_1: 6.0
  Q5_K: 5.5
  Q4_0: 4.5
  Q4_1: 5.0
  Q4_K: 4.5
  Q3_K: 3.4375
  Q2_K: 2.625
  IQ4_XS: 4.25
  IQ4_NL: 4.5
  IQ3_S: 3.4375
  IQ3_XXS: 3.0625
  IQ2_S: 2.5625
  IQ2_XS: 2.3125
  IQ2_XXS: 2.0625
  IQ1_M: 1.75
  IQ1_S: 1.5625
  TQ2_0: 2.0625
  TQ1_0: 1.6875
  MXFP4: 4.25
  NVFP4: 4.5
  Q2_0: 2.25
  Q1_0: 1.125

# Effective bits-per-weight of llama-quantize file types (mixes: e.g. Q4_K_M keeps some
# attention/ffn tensors at Q6_K and the output at Q6_K). Filled from llama-quantize --help,
# which prints the file size of each type for Llama-3-8B (8.03B params):
# bpw = size_bytes * 8 / params. See file_types_provenance.
file_types_provenance:
  source_url: https://github.com/ggml-org/llama.cpp/blob/master/tools/quantize/quantize.cpp
  fetched_at: "2026-09-25"
  note: sizes printed by `llama-quantize --help` (b11177) for Llama-3-8B; effective bpw = GiB*2^30*8/8.03e9
