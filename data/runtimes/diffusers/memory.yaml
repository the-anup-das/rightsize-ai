      allocator cache the load leaves behind. The post's 8-bit row (23.4 GiB, about the
      same as without offloading) suggests bnb int8 weights stayed on the GPU; not replayed
  # SDXL base 1.0 on an A100 40GB: 4 images per prompt at the default 1024x1024, FP16
