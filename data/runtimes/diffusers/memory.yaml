# Memory model for diffusers pipelines (fit/diffusion.py), and the published measurements
# it is checked against. tests/test_families.py replays every measurement below; F9 refits
# the constants from these rows and from users' runs.
#
# A pipeline runs in phases - encode the prompt, denoise, decode the latents - and the
# peak is the worst phase: the weights resident in it plus that phase's activations.
# Offloading changes which weights are resident, not the activations.
constants:
  # VAE decode of one image, per output pixel. AutoencoderKL-family decoders (SD, SDXL,
  # FLUX, SD3) work at full resolution in their last blocks; SDXL's rows put one 1024x1024
  # image at 3.8-5 GiB and FLUX's at up to 4.7 GiB, so 4000 B/px (4.2 GB per megapixel).
  vae_decode_bytes_per_pixel: 4000
  # UNet activations per latent pixel per sample (classifier-free guidance doubles the
  # samples). From the SDXL rows with VAE slicing: 8 samples at 128x128 latents.
  unet_bytes_per_latent_pixel: 73728
  # Transformer (DiT/MMDiT) activations: tokens x hidden x 2 bytes x this factor. Not
  # separable in the published rows (the VAE decode sets FLUX's peak); a round figure
  # that makes one FLUX step at 1024x1024 cost ~0.7 GB.
  dit_activation_factor: 24
  text_encode_gb: 0.25
  default_text_tokens: 512
  # Weights on the GPU at once under sequential offloading: about one layer.
  sequential_resident_gb: 0.25
  # Not counted by torch's memory counters, but held on the card: the CUDA context and
  # library workspaces. A typical figure, not measured here.
  cuda_context_gb: 0.6
  # The caching allocator's fragmentation, as a fraction of the peak.
  allocator_slack: 0.05
constants_source:
  source_url: https://huggingface.co/blog/diffusers-quantization
  fetched_at: "2026-09-25"
  hand: true
  note: fitted by hand to the measurements below; SDXL rows from the SDXL optimisation post

measurements:
  # FLUX.1-dev on 1x H100 80GB, 1024x1024, 50 steps, guidance 3.5, max_sequence_length 512.
  # Measured with torch.cuda.max_memory_reserved() / 1024**3, so the "GB" in the post is
  # GiB, and reserved memory includes the allocator's cache. Components: transformer
  # 23.8 GB, T5 9.52 GB, CLIP 246 MB, VAE 168 MB in BF16 (stated in the post).
  - id: flux-dev-bf16
    source_url: https://huggingface.co/blog/diffusers-quantization
    model: black-forest-labs/FLUX.1-dev
    hardware: H100 80GB
    metric: max_memory_reserved
    resolution: [1024, 1024]
    batch: 1
    offload: none
    quant: {}
    after_loading_gib: 31.447
    peak_gib: 36.166
    tolerance: 0.08
  - id: flux-dev-bnb-nf4
    source_url: https://huggingface.co/blog/diffusers-quantization
    model: black-forest-labs/FLUX.1-dev
    hardware: H100 80GB
    metric: max_memory_reserved
    resolution: [1024, 1024]
    batch: 1
    offload: none
    quant: {transformer: nf4, text_encoder_2: nf4}
    after_loading_gib: 12.584
    peak_gib: 17.281
    tolerance: 0.22
    note: >-
      bitsandbytes quantizes while loading, and both bnb rows sit ~3.3 GiB above their
      weights in reserved memory; the estimate is low by about that much
  - id: flux-dev-bnb-int8
