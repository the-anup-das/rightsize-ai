
# Degradation gate for quantized LLMs (F8). Mean KL divergence of the quantized model's token
# distribution vs the 16-bit reference over the evaluation text, plus top-1 agreement.
# Scale after the community KLD conventions (llama.cpp perplexity tool, LocalBench, smcleod 2026):
#   < 0.01 near-lossless, 0.01-0.05 good, 0.05-0.15 noticeable, > 0.15 damaged.
provenance:
  source_url: https://github.com/ggml-org/llama.cpp/blob/master/tools/perplexity/README.md
  fetched_at: "2026-09-25"
  note: thresholds are a starting point; refit from measurements (F9)
kld:
  pass_below: 0.05
  warn_below: 0.15
top1_agreement:
  pass_above: 0.90
  warn_above: 0.80
# Embedding models: mean cosine between the quantized model's vectors and the original's
# over lines of the evaluation text. A hand-set starting point: all-MiniLM-L6-v2's dynamic
# int8 ONNX export measured 0.991-0.993 (2026-09-28), and a vector that keeps cosine 0.99
# to its original keeps its neighbours; below 0.97 the ranking starts to move.
embedding_cosine:
  pass_above: 0.99
  warn_above: 0.97
