id: unsloth/sft
framework: unsloth
stage: finetune
families: [llm]
hardware: { vendors: [nvidia, amd, intel], note: "NVIDIA compute capability 7.0 or newer" }
install_line: 'uv pip install unsloth --torch-backend=auto, in its own environment: unsloth pins trl<=0.24.0, transformers<=5.5.0 and datasets<4.4'
kind: config
language: python
inputs:
  model: { type: str, required: true, help: Hub id of the model to fine-tune }
  load_in_4bit: { type: enum, values: ["True", "False"], default: "True", help: "True for QLoRA, False for 16-bit LoRA" }
  max_seq_length: { type: int, default: 2048 }
  lora_r: { type: int, default: 16, help: "16 or 32, per Unsloth's hyperparameter guide" }
  lora_alpha: { type: int, default: 16, help: "r or 2r" }
  dataset: { type: str, default: mlabonne/FineTome-100k, help: "a Hub dataset of conversations; replace with yours" }
  split: { type: str, default: train, help: "a slice for a short run, e.g. train[:500]" }
  messages_column: { type: str, default: conversations, help: "conversations (ShareGPT from/value) or messages (role/content)" }
  chat_template: { type: str, help: "empty keeps the model's own template; else an Unsloth name such as chatml, llama-3.1, qwen-2.5, gemma-3" }
  num_epochs: { type: int, default: 1 }
  max_steps: { type: int, default: -1, help: "stop after this many optimizer steps; -1 trains num_epochs" }
  output_dir: { type: path, default: outputs }
  merged_dir: { type: path, default: merged, help: "the merged 16-bit model the llama.cpp steps convert next" }
file: unsloth_sft.py
writes: [merged_dir]
template: |
  from unsloth import FastLanguageModel  # import unsloth before trl and transformers
  from unsloth.chat_templates import get_chat_template, standardize_sharegpt
  from datasets import load_dataset
  from trl import SFTConfig, SFTTrainer


  def main():
      model, tokenizer = FastLanguageModel.from_pretrained(
          model_name="{{ model }}", max_seq_length={{ max_seq_length }}, load_in_4bit={{ load_in_4bit }})
      model = FastLanguageModel.get_peft_model(
          model, r={{ lora_r }}, lora_alpha={{ lora_alpha }},
          target_modules=["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"],
          lora_dropout=0, bias="none", use_gradient_checkpointing="unsloth", random_state=3407)
      {% if chat_template %}tokenizer = get_chat_template(tokenizer, chat_template="{{ chat_template }}")
      {% endif %}dataset = standardize_sharegpt(load_dataset("{{ dataset }}", split="{{ split }}"))

      def formatting_prompts_func(examples):
          convos = examples["{{ messages_column }}"]
          return {"text": [tokenizer.apply_chat_template(c, tokenize=False, add_generation_prompt=False)
                           for c in convos]}

      dataset = dataset.map(formatting_prompts_func, batched=True)
      trainer = SFTTrainer(
          model=model, tokenizer=tokenizer, train_dataset=dataset,
          args=SFTConfig(dataset_text_field="text", per_device_train_batch_size=2,
                         gradient_accumulation_steps=4, num_train_epochs={{ num_epochs }},
                         max_steps={{ max_steps }}, learning_rate=2e-4, optim="adamw_8bit",
                         output_dir="{{ output_dir }}", report_to="none"))
      trainer.train()
      model.save_pretrained_merged("{{ merged_dir }}", tokenizer, save_method="merged_16bit")


  if __name__ == "__main__":  # worker processes re-import this file on Windows and macOS
      main()
notes:
  - "save as train.py and run it with python where unsloth is installed"
  - "save_pretrained_merged writes the 16-bit model the llama.cpp steps convert next; model.save_pretrained_gguf(dir, tokenizer, quantization_method='q4_k_m') is the one-step alternative, and builds llama.cpp on first use"
  - "use the same chat template at inference as in training"
  - "tokenizer= is Unsloth's name for TRL's processing_class; TRL 0.24 calls the length max_length"
source_doc_url: https://github.com/unslothai/notebooks/blob/main/nb/Qwen3_(14B)-Reasoning-Conversational.ipynb
version_tested: 2026.9.11
verified: docs
