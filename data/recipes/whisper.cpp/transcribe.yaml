id: whisper.cpp/transcribe
framework: whisper.cpp
stage: serve
families: [audio]
hardware: { vendors: [any] }
install_line: 'git clone https://github.com/ggml-org/whisper.cpp && cd whisper.cpp && cmake -B build && cmake --build build -j --config Release, or brew install whisper.cpp'
kind: command
inputs:
  cli_bin: { type: path, default: ./build/bin/whisper-cli }
  model: { type: path, default: models/ggml-large-v3-turbo-q5_0.bin }
  audio: { type: path, required: true, help: "16 kHz 16-bit WAV" }
  language: { type: str, default: auto }
template: >-
  {{ cli_bin }} -m {{ model }} -l {{ language }} -f {{ audio }}
notes:
  - "convert other audio first: ffmpeg -i input.mp3 -ar 16000 -ac 1 -c:a pcm_s16le output.wav"
  - "-otxt, -osrt, -ovtt or -oj write a transcript file; ./main is now whisper-cli"
source_doc_url: https://github.com/ggml-org/whisper.cpp/blob/master/examples/cli/README.md
version_tested: v1.9.4
verified: docs
