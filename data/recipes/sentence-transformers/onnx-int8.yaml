id: sentence-transformers/onnx-int8
framework: sentence-transformers
stage: quantize
families: [embedding]
hardware: { vendors: [cpu] }
install_line: pip install "sentence-transformers[onnx]"
kind: config
language: python
inputs:
  model: { type: str, required: true }
  output_dir: { type: path, default: onnx-model }
  cpu_target: { type: enum, values: [avx2, avx512, avx512_vnni, arm64], default: avx2 }
file: onnx_int8.py
writes: [output_dir]
template: |
  from sentence_transformers import SentenceTransformer, export_dynamic_quantized_onnx_model

  model = SentenceTransformer("{{ model }}", backend="onnx")
  model.save_pretrained("{{ output_dir }}")
  export_dynamic_quantized_onnx_model(
      model=model, quantization_config="{{ cpu_target }}", model_name_or_path="{{ output_dir }}")
notes:
  - "load: SentenceTransformer(output_dir, backend='onnx', model_kwargs={'file_name': 'onnx/model_qint8_<target>.onnx'})"
  - "dynamic int8 is for CPUs and likely slower on a GPU"
  - "the [onnx] extra resolves to sentence-transformers 5.7 with transformers 4.57 (optimum-onnx pins transformers<4.58)"
source_doc_url: https://sbert.net/docs/sentence_transformer/usage/efficiency.html
version_tested: 6.1.0
verified: docs
