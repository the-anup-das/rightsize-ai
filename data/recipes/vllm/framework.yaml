# What this toolkit is for, where it runs, how it installs and how its steps join a plan.
name: vllm
title: vLLM
summary: >-
  Serves Hugging Face models with high throughput on NVIDIA and AMD GPUs, including the FP8,
  AWQ, GPTQ and compressed-tensors checkpoints
stages: [serve]
families: [llm]
hardware: {vendors: [nvidia, amd], os: [linux]}
install:
  kind: pip
  packages: [vllm]
  needs_torch: true
  check: vllm
  line: uv pip install vllm --torch-backend=auto
homepage: https://github.com/vllm-project/vllm
source_doc_url: https://docs.vllm.ai/en/stable/cli/serve/
version_tested: 0.30.0
