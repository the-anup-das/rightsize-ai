# What this toolkit is for, where it runs, how it installs and how its steps join a plan.
name: transformers
title: Transformers
summary: >-
  Loads a model quantized on the fly to 4-bit NF4 (or 8-bit) with bitsandbytes, and can save
  the quantized checkpoint
stages: [quantize]
families: [llm]
formats: [bnb]
hardware: {vendors: [nvidia, amd, intel]}
install:
  kind: pip
  packages: [transformers, accelerate, bitsandbytes]
  needs_torch: true
  check: transformers
  line: pip install --upgrade transformers accelerate bitsandbytes
homepage: https://github.com/huggingface/transformers
source_doc_url: https://huggingface.co/docs/transformers/en/quantization/bitsandbytes
version_tested: 5.17.0
