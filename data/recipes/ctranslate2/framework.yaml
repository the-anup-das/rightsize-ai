# What this toolkit is for, where it runs, how it installs and how its steps join a plan.
name: ctranslate2
title: CTranslate2
summary: >-
  Converts Whisper and other transformer models to CTranslate2, int8 or float16, the format
  faster-whisper runs
stages: [convert]
families: [audio]
formats: [ctranslate2]
hardware: {vendors: [nvidia, cpu]}
install:
  kind: pip
  packages: [ctranslate2, "transformers[torch]"]
  check: ctranslate2
  line: pip install ctranslate2 "transformers[torch]"
homepage: https://github.com/OpenNMT/CTranslate2
source_doc_url: https://opennmt.net/CTranslate2/guides/transformers.html
version_tested: 4.8.2
