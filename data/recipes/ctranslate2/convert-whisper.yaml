id: ctranslate2/convert-whisper
framework: ctranslate2
stage: convert
families: [audio]
hardware: { vendors: [nvidia, cpu] }
install_line: pip install ctranslate2 "transformers[torch]"
kind: command
inputs:
  model: { type: str, required: true, help: "a Whisper repo, e.g. openai/whisper-large-v3-turbo" }
  output_dir: { type: path, default: whisper-ct2 }
  quantization: { type: enum, values: [int8_float16, int8, int8_float32, int8_bfloat16, int16, float16, bfloat16, float32], default: int8_float16 }
writes: [output_dir]
targets:
  - {name: ct2-int8, inputs: {quantization: int8_float16}, size_from: int8}
template: >-
  ct2-transformers-converter --model {{ model }} --output_dir {{ output_dir }} --quantization {{ quantization }} --copy_files tokenizer.json preprocessor_config.json
notes:
  - "load it with faster_whisper.WhisperModel(output_dir); compute_type= can convert the stored type again at load"
  - "rightsize estimate MODEL --quant int8 --runtime faster-whisper gives the memory"
  - "the conversion runs on the CPU; on Windows the GPU needs cublas64_12.dll on PATH, which the ctranslate2 wheel does not ship: a CUDA 12 build of PyTorch has it in torch/lib"
  - "run on Windows with an RTX 4070 Ti SUPER (rightsize quantize --to ct2-int8): whisper-tiny in 44 s, a 38.9 MB model.bin; it decodes on the CPU (int8) and on the GPU (int8_float16)"
source_doc_url: https://opennmt.net/CTranslate2/guides/transformers.html
version_tested: 4.8.2
verified: run
