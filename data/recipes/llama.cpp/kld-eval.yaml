id: llama.cpp/kld-eval
framework: llama.cpp
stage: evaluate
families: [llm]
hardware: { vendors: [any] }
install_line: 'download a release from https://github.com/ggml-org/llama.cpp/releases (llama-perplexity)'
kind: command
inputs:
  perplexity_bin: { type: path, required: true }
  model_gguf: { type: path, required: true, help: the quantized file under test }
  eval_file: { type: path, required: true }
  logits_file: { type: path, required: true, help: reference logits from kld-base }
  gpu_layers: { type: str, default: all }
  ctx: { type: int, default: 512 }
  chunks: { type: int, required: false }
template: >-
  {{ perplexity_bin }} -m {{ model_gguf }} -f {{ eval_file }} --kl-divergence-base {{ logits_file }} --kl-divergence -ngl {{ gpu_layers }} -c {{ ctx }} {% if chunks %}--chunks {{ chunks }}{% endif %}
notes:
  - "reports mean KLD, KLD percentiles, top-1 agreement and PPL delta vs the reference"
source_doc_url: https://github.com/ggml-org/llama.cpp/blob/master/tools/perplexity/README.md
version_tested: b11177
