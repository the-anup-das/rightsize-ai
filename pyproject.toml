[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rightsize"
version = "0.0.1"
description = "Quantize and fit any model to your hardware: pick a model, pick your hardware, get a runnable quantized plan."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anup Das" }]
keywords = [
  "quantization", "gguf", "llama.cpp", "vram", "fine-tuning", "qlora",
  "unsloth", "mlx", "vllm", "diffusion", "whisper", "embeddings", "mcp",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Lightweight rule 1: the core depends on these three only. Enforced by tests/budgets and CI.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Surfaces
mcp = ["mcp>=1.2"]
# Colour, tables and progress bars in the terminal; plain text without it.
cli = ["rich>=13.7"]
# Hardware detection uses subprocess + httpx only today; extra reserved for optional probes.
detect = []
# Execution adapters (F8). Imported lazily, never at startup.
# llamacpp: converting safetensors -> GGUF runs llama.cpp's convert_hf_to_gguf.py, which needs
# torch + transformers. Quantizing an existing GGUF needs only the llama.cpp binaries.
llamacpp = [
  "rich>=13.7",
  "gguf>=0.17",
  "numpy>=1.26",
  "torch>=2.4",
  "transformers>=4.45",
  "sentencepiece>=0.2",
  "protobuf>=4",
  "safetensors>=0.4",
  "huggingface_hub>=0.30",
]
unsloth = []
diffusers = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
rightsize = "rightsize.cli:main"

[project.entry-points."rightsize.adapters"]
# Third-party execution adapters register here (F8).

[project.entry-points."rightsize.recipes"]
# Third-party recipe packs register here (F5).

[project.urls]
Homepage = "https://github.com/the-anup-das/rightsize-ai"
Repository = "https://github.com/the-anup-das/rightsize-ai"
Issues = "https://github.com/the-anup-das/rightsize-ai/issues"
Roadmap = "https://github.com/the-anup-das/rightsize-ai/tree/main/docs/plans"

[tool.hatch.build.targets.wheel]
packages = ["src/rightsize"]

# The data seed ships inside the wheel until rightsize-data is split out (lightweight rule 2).
# In editable installs the loader falls back to the repo's data/ folder.
[tool.hatch.build.targets.wheel.force-include]
"data" = "rightsize/_data"

# The sdist has to carry data/ too: `uv build` makes the wheel from the sdist, so anything
# missing here is missing from the wheel, and an install from PyPI has no hardware table at
# all. tests/budgets/test_imports.py checks the built wheel actually contains it.
[tool.hatch.build.targets.sdist]
include = [
  "src/rightsize",
  "data",
  "tests",
  "scripts",
  "docs",
  "notebooks",
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "pyproject.toml",
]

# torch CPU wheels for the [llamacpp] extra on Windows/Linux; macOS uses the default index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# T20: print() is allowed in the CLI and in tests only.
"src/rightsize/cli.py" = ["T20"]
"src/rightsize/_console.py" = ["T20"]
"tests/**" = ["T20"]
# notebook cell sources are embedded strings; wrapping them would wrap the cells
"scripts/make_notebooks.py" = ["E501", "T20"]
# ingest scripts are run by hand and report what they fetched
"scripts/ingest_hf_hardware.py" = ["T20"]
"scripts/ingest_bandwidth.py" = ["T20", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: runs real toolchains and downloads; excluded by default (uv run pytest -m slow)",
  "network: reads the Hugging Face Hub; excluded by default (uv run pytest -m network)",
]
addopts = "-q -m 'not slow and not network'"
