[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rightsize"
version = "0.0.1"
description = "Quantize and fit any model to your hardware: pick a model, pick your hardware, get a runnable quantized plan."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anup Das" }]
keywords = [
  "quantization", "gguf", "llama.cpp", "vram", "fine-tuning", "qlora",
  "unsloth", "mlx", "vllm", "diffusion", "whisper", "embeddings", "mcp",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Lightweight rule 1: the core depends on these three only. Enforced by tests/budgets and CI.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Surfaces
mcp = ["mcp>=1.2"]
# Hardware detection uses subprocess + httpx only today; extra reserved for optional probes.
detect = []
# Execution adapters (F8). Populated when each adapter lands; imported lazily, never at startup.
unsloth = []
llamacpp = []
diffusers = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
rightsize = "rightsize.cli:main"

[project.entry-points."rightsize.adapters"]
# Third-party execution adapters register here (F8).

[project.entry-points."rightsize.recipes"]
# Third-party recipe packs register here (F5).

[project.urls]
Homepage = "https://github.com/the-anup-das/rightsize-ai"
Repository = "https://github.com/the-anup-das/rightsize-ai"
Issues = "https://github.com/the-anup-das/rightsize-ai/issues"
Roadmap = "https://github.com/the-anup-das/rightsize-ai/tree/main/docs/plans"

[tool.hatch.build.targets.wheel]
packages = ["src/rightsize"]

[tool.hatch.build.targets.sdist]
include = ["src/rightsize", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# T20: print() is allowed in the CLI and in tests only.
"src/rightsize/cli.py" = ["T20"]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: needs a real GPU or network; excluded by default in CI",
]
